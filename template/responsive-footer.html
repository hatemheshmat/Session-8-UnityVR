<!-- Notes Panel -->
<div id="notesPanel" class="notes-panel">
    <div class="notes-panel-header">
        <h3>Slide Notes</h3>
        <button id="closeNotesBtn" class="footer-button">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="notes-panel-content">
        <textarea id="slideNotes" placeholder="Add your notes for this slide..."></textarea>
    </div>
</div>

<!-- Initialize footer functionality -->
<script>
    // Set current slide number and total
    document.getElementById('currentSlideNum').textContent = CURRENT_SLIDE_NUMBER;
    document.getElementById('totalSlides').textContent = TOTAL_SLIDES;
    
    // Update progress bar
    document.getElementById('slideProgress').style.width = (CURRENT_SLIDE_NUMBER / TOTAL_SLIDES * 100) + '%';
    
    // Close notes panel button
    document.getElementById('closeNotesBtn').addEventListener('click', function() {
        document.getElementById('notesPanel').classList.remove('show');
        document.getElementById('notesBtn').querySelector('i').className = 'fas fa-sticky-note';
    });
    
    // Load saved notes if any
    const slideId = window.location.pathname.split('/').pop().replace('.html', '');
    const savedNotes = localStorage.getItem('slideNotes_' + slideId);
    if (savedNotes) {
        document.getElementById('slideNotes').value = savedNotes;
    }
    
    // Save notes when changed
    document.getElementById('slideNotes').addEventListener('input', function() {
        localStorage.setItem('slideNotes_' + slideId, this.value);
    });
</script>
